name: DLV Yandex priority re-crawl (one-time setup or manual)

on:
  # Trigger once when this workflow is first added to main.
  # Later normal site commits do not re-submit pages or spend quota.
  push:
    branches: [main]
    paths:
      - ".github/workflows/yandex-priority-recrawl.yml"
  # Future re-crawl attempts are explicitly initiated by a user.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reindex:
    name: "Yandex: four commercial URLs re-crawl"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check code and install API dependencies
        run: |
          python3 -m py_compile scripts/yandex_webmaster_analytics.py
          python -m pip install "google-auth>=2.30,<3" "requests>=2.31,<3"
      - name: Confirm verified Yandex host and queue four priority URLs once
        run: python scripts/yandex_webmaster_analytics.py
        env:
          DLV_SEO_SHEET_ID: "14GI6k61MSsqpjFFm9w6fZHTteGhKvKnN3_Hn8o9Gq3k"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          DLV_YANDEX_RECRAWL: "true"
