name: DLV Google index coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google-index-coverage.yml"
      - "scripts/google_index_audit.py"
      - "sitemap.xml"
  schedule:
    # Tuesdays around 09:47 Novosibirsk (02:47 UTC).
    - cron: "47 2 * * 2"

permissions:
  contents: read

jobs:
  inspect:
    name: Google Search Console URL inspection (private sheet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only Google API client
        run: python -m pip install "google-auth>=2.30,<3" "requests>=2.31,<3"
      - name: Inspect site URLs and write private spreadsheet
        run: python scripts/google_index_audit.py
        env:
          DLV_SEO_SHEET_ID: "14GI6k61MSsqpjFFm9w6fZHTteGhKvKnN3_Hn8o9Gq3k"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
