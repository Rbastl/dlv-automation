name: DLV Google and Yandex search statistics

on:
  workflow_dispatch:
    inputs:
      request_reindex:
        description: "Yandex: submit four priority commercial URLs for re-crawl (manual only)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-search-analytics.yml"
      - "scripts/seo_search_analytics.py"
      - "scripts/yandex_webmaster_analytics.py"
  schedule:
    # Mon and Thu around 09:23 Novosibirsk (02:23 UTC): two early SEO pulses/week.
    # The 7-day GSC windows overlap: compare only date-disjoint weeks for growth.
    # Existing collectors skip duplicate period keys in private Google Sheets.
    - cron: "23 2 * * 1,4"

permissions:
  contents: read

# Period/URI recovery appends missing rows. Serialize existing collector runs
# so two simultaneous invocations cannot append the same missing identities.
concurrency:
  group: dlv-search-analytics-collector
  cancel-in-progress: false

jobs:
  google:
    name: Google Search Console to private Google Sheet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Google collector and install API libraries
        run: |
          python3 -m py_compile scripts/seo_search_analytics.py
          python -m pip install "google-auth>=2.30,<3" "requests>=2.31,<3"
      - name: Read Google search data and update private spreadsheet
        run: python scripts/seo_search_analytics.py
        env:
          DLV_SEO_SHEET_ID: "14GI6k61MSsqpjFFm9w6fZHTteGhKvKnN3_Hn8o9Gq3k"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DLV_YANDEX_ENABLED: "false" # Separate independent job below

  yandex:
    name: "Yandex Webmaster: sitemap, index and private search metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Yandex collector and install API libraries
        run: |
          python3 -m py_compile scripts/yandex_webmaster_analytics.py
          python -m pip install "google-auth>=2.30,<3" "requests>=2.31,<3"
      - name: Check existing Yandex OAuth and verified HTTPS host, register sitemap once, collect metrics
        run: python scripts/yandex_webmaster_analytics.py
        env:
          DLV_SEO_SHEET_ID: "14GI6k61MSsqpjFFm9w6fZHTteGhKvKnN3_Hn8o9Gq3k"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          DLV_YANDEX_RECRAWL: ${{ github.event_name == 'workflow_dispatch' && inputs.request_reindex && 'true' || 'false' }}

